<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/icon-CBH5Z7Ew.png" />
    <link rel="apple-touch-icon" href="./assets/icon-CBH5Z7Ew.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeorgisWork" />
    <meta name="description" content="Sistema de Gestión de Trabajos CNC (PWA Local) con persistencia IndexedDB y exportación de reportes." />
    <title>GeorgisWork - Gestión de Trabajos CNC</title>
    <script type="module" crossorigin src="./assets/index-Cj_lW4zS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-aQ5j8Np0.css">
  </head>
  <body class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white transition-colors duration-200">
    
    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800/80 transition-colors">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Brand Title -->
          <div class="flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 p-0.5 shadow-md shadow-blue-500/20 flex items-center justify-center">
              <img src="./assets/icon-CBH5Z7Ew.png" alt="GeorgisWork Logo" class="h-full w-full object-cover rounded-[10px]" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              <div class="hidden h-full w-full bg-zinc-950 rounded-[10px] items-center justify-center text-cyan-400 font-bold text-lg">GW</div>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-lg text-zinc-900 dark:text-white font-bold tracking-tight">
                  GeorgisWork
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">
                  CNC v1.0
                </span>
              </div>
              <p class="text-xs text-zinc-500 dark:text-zinc-400">Control de Fabricación & Horas Extras</p>
            </div>
          </div>

          <!-- Desktop Navigation Tabs (Segmented Control estilo Linear/shadcn) -->
          <nav id="desktop-nav" class="hidden md:flex items-center p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-900/80 border border-zinc-300/60 dark:border-zinc-800 space-x-1">
            <button data-nav="catalogo" class="nav-tab active flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-zinc-900 dark:text-white bg-white dark:bg-zinc-800 shadow-sm border border-zinc-200/80 dark:border-zinc-700/60">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span>1. Catálogo</span>
            </button>
            <button data-nav="seleccion" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/50">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>2. Selección</span>
            </button>
            <button data-nav="control" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/50">
              <i data-lucide="play-circle" class="w-4 h-4"></i>
              <span>3. Control en Vivo</span>
            </button>
            <button data-nav="historial" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/50">
              <i data-lucide="history" class="w-4 h-4"></i>
              <span>4. Historial</span>
            </button>
            <button data-nav="horas-extras" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/50">
              <i data-lucide="clock" class="w-4 h-4"></i>
              <span>5. Horas Extras</span>
            </button>
          </nav>

          <!-- Right Action: Config Modal Gear (Header Limpio) -->
          <div class="flex items-center">
            <button id="btn-open-settings" title="Configuración y Respaldos" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-zinc-700 dark:text-zinc-300 bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-900 dark:hover:bg-zinc-800 hover:text-zinc-900 dark:hover:text-white transition-all border border-zinc-200 dark:border-zinc-800 shadow-sm active:scale-95">
              <i data-lucide="settings" class="w-4 h-4"></i>
              <span class="hidden sm:inline text-xs font-semibold">Configuración</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Mobile Sub-Navigation Bar (Scrollable) -->
      <div class="md:hidden border-t border-zinc-200 dark:border-zinc-800/80 bg-zinc-100/90 dark:bg-zinc-950/90 overflow-x-auto py-2 px-4 no-scrollbar">
        <div id="mobile-nav" class="flex space-x-1.5 min-w-max p-1 rounded-xl bg-zinc-200/70 dark:bg-zinc-900/80 border border-zinc-300/50 dark:border-zinc-800">
          <button data-nav="catalogo" class="nav-tab-mobile active px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-900 dark:text-white bg-white dark:bg-zinc-800 shadow-sm border border-zinc-200/80 dark:border-zinc-700/60 flex items-center space-x-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>1. Catálogo</span>
          </button>
          <button data-nav="seleccion" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 flex items-center space-x-1.5">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
            <span>2. Selección</span>
          </button>
          <button data-nav="control" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 flex items-center space-x-1.5">
            <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
            <span>3. Control</span>
          </button>
          <button data-nav="historial" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 flex items-center space-x-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
            <span>4. Historial</span>
          </button>
          <button data-nav="horas-extras" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 flex items-center space-x-1.5">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>5. H. Extras</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      
      <!-- System DB Connection & Status Card -->
      <div id="db-status-banner" class="mb-6 p-4 rounded-2xl bg-white dark:bg-zinc-900/80 border border-zinc-200 dark:border-zinc-800 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-colors">
        <div class="flex items-center space-x-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-md shadow-emerald-500/40"></div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-sm font-bold text-zinc-800 dark:text-zinc-200">Base de Datos IndexedDB (Dexie.js)</span>
              <span id="db-status-pill" class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-mono border border-emerald-500/30">Conectada</span>
            </div>
            <p id="db-status-details" class="text-xs text-zinc-500 dark:text-zinc-400 font-mono mt-0.5">Verificando tablas del esquema...</p>
          </div>
        </div>
        <div class="flex items-center space-x-2 text-xs">
          <span class="px-2.5 py-1 rounded-lg bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700/70 font-mono">Esquema v1</span>
          <button id="btn-test-db" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition-colors flex items-center space-x-1 shadow-sm active:scale-95">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span>Probar Test DB</span>
          </button>
        </div>
      </div>

      <!-- Dynamic Views Container -->
      <div id="view-container" class="min-h-[400px]">
        <!-- Active View rendered by main.js -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-200 dark:border-zinc-800/80 py-4 px-4 sm:px-6 lg:px-8 text-center text-xs text-zinc-500 dark:text-zinc-400 bg-white/50 dark:bg-zinc-950/40 transition-colors">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>GeorgisWork CNC &copy; 2026 - PWA Offline Local</p>
        <p class="text-zinc-400 dark:text-zinc-600 font-mono">Módulo 1: Setup & Dexie.js OK</p>
      </div>
    </footer>

    <!-- Contenedor dinámico de modales -->
    <div id="modal-container-root"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  </body>
</html>
