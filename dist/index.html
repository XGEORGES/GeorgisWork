<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/icon-CBH5Z7Ew.png" />
    <link rel="apple-touch-icon" href="./assets/icon-CBH5Z7Ew.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeorgisWork" />
    <meta name="description" content="Sistema de Gestión de Trabajos CNC (PWA Local) con persistencia IndexedDB y exportación de reportes." />
    <title>GeorgisWork - Gestión de Trabajos CNC</title>
    <script type="module" crossorigin src="./assets/index-Bv4errHp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-MgVm-IF2.css">
  </head>
  <body class="bg-[#f1f5f9] text-slate-900 dark:bg-[#090d16] dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-200">
    
    <!-- Top Navigation Header (Pill Dock Superior) -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-[#090d16]/85 backdrop-blur-xl border-b border-slate-200/90 dark:border-slate-800/80 transition-colors">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Brand Title (Sólido y Nítido) -->
          <div class="flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-cyan-600/20 border border-cyan-500/40 p-0.5 shadow-md shadow-cyan-500/10 flex items-center justify-center">
              <img src="./assets/icon-CBH5Z7Ew.png" alt="GeorgisWork Logo" class="h-full w-full object-cover rounded-[10px]" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              <div class="hidden h-full w-full bg-slate-950 rounded-[10px] items-center justify-center text-cyan-400 font-bold text-lg">GW</div>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-lg text-slate-900 dark:text-white font-bold tracking-tight">
                  GeorgisWork
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-cyan-500/10 text-cyan-700 dark:text-cyan-400 border border-cyan-500/20">
                  CNC v1.0
                </span>
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400">Control de Fabricación & Horas Extras</p>
            </div>
          </div>

          <!-- Desktop Navigation Tabs (Segmented Control Pill Dock) -->
          <nav id="desktop-nav" class="hidden md:flex items-center p-1 rounded-xl bg-slate-200/70 dark:bg-slate-900/70 border border-slate-300/60 dark:border-slate-800/80 space-x-1 shadow-inner">
            <button data-nav="catalogo" class="nav-tab active flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-cyan-700 dark:text-cyan-400 bg-white dark:bg-slate-800 shadow-sm border border-slate-300/80 dark:border-slate-700/60">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span>1. Catálogo</span>
            </button>
            <button data-nav="seleccion" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/60 dark:hover:bg-slate-800/50">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>2. Selección</span>
            </button>
            <button data-nav="control" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/60 dark:hover:bg-slate-800/50">
              <i data-lucide="play-circle" class="w-4 h-4"></i>
              <span>3. Control en Vivo</span>
            </button>
            <button data-nav="historial" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/60 dark:hover:bg-slate-800/50">
              <i data-lucide="history" class="w-4 h-4"></i>
              <span>4. Historial</span>
            </button>
            <button data-nav="horas-extras" class="nav-tab flex items-center space-x-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 hover:bg-slate-200/60 dark:hover:bg-slate-800/50">
              <i data-lucide="clock" class="w-4 h-4"></i>
              <span>5. Horas Extras</span>
            </button>
          </nav>

          <!-- Right Action: Config Modal Gear -->
          <div class="flex items-center">
            <button id="btn-open-settings" title="Configuración y Respaldos" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-slate-700 dark:text-slate-300 bg-slate-100 hover:bg-slate-200 dark:bg-slate-900 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition-all border border-slate-200 dark:border-slate-800 shadow-sm active:scale-95">
              <i data-lucide="settings" class="w-4 h-4"></i>
              <span class="hidden sm:inline text-xs font-semibold">Configuración</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Mobile Sub-Navigation Bar (Scrollable) -->
      <div class="md:hidden border-t border-slate-200/90 dark:border-slate-800/80 bg-slate-100/90 dark:bg-[#090d16]/90 overflow-x-auto py-2 px-4 no-scrollbar">
        <div id="mobile-nav" class="flex space-x-1.5 min-w-max p-1 rounded-xl bg-slate-200/70 dark:bg-slate-900/80 border border-slate-300/50 dark:border-slate-800">
          <button data-nav="catalogo" class="nav-tab-mobile active px-3 py-1.5 rounded-lg text-xs font-semibold text-cyan-700 dark:text-cyan-400 bg-white dark:bg-slate-800 shadow-sm border border-slate-300/80 dark:border-slate-700/60 flex items-center space-x-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>1. Catálogo</span>
          </button>
          <button data-nav="seleccion" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center space-x-1.5">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
            <span>2. Selección</span>
          </button>
          <button data-nav="control" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center space-x-1.5">
            <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
            <span>3. Control</span>
          </button>
          <button data-nav="historial" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center space-x-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
            <span>4. Historial</span>
          </button>
          <button data-nav="horas-extras" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 flex items-center space-x-1.5">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>5. H. Extras</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container (100% Limpio sin banners intrusivos) -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      
      <!-- Dynamic Views Container -->
      <div id="view-container" class="min-h-[450px]">
        <!-- Active View rendered by main.js -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200/90 dark:border-slate-800/80 py-4 px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 dark:text-slate-500 bg-white/50 dark:bg-[#090d16]/50 transition-colors">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>GeorgisWork CNC &copy; 2026 - PWA Offline Local</p>
        <p class="text-slate-400 dark:text-slate-600 font-mono">Control de Fabricación & Horas Extras</p>
      </div>
    </footer>

    <!-- Contenedor dinámico de modales -->
    <div id="modal-container-root"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  </body>
</html>
