<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeorgisWork" />
    <meta name="description" content="Sistema de Gestión de Trabajos CNC (PWA Local) con persistencia IndexedDB y exportación de reportes." />
    <title>GeorgisWork - Gestión de Trabajos CNC</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">
    
    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          
          <!-- Logo & Brand Title -->
          <div class="flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 p-0.5 shadow-lg shadow-blue-500/20 flex items-center justify-center">
              <img src="./icon.png" alt="GeorgisWork Logo" class="h-full w-full object-cover rounded-[10px]" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              <div class="hidden h-full w-full bg-slate-950 rounded-[10px] items-center justify-center text-cyan-400 font-bold text-lg">GW</div>
            </div>
            <div>
              <div class="flex items-center space-x-2">
                <span class="text-lg text-white font-bold tracking-tight">
                  GeorgisWork
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                  CNC v1.0
                </span>
              </div>
              <p class="text-xs text-slate-400">Control de Fabricación & Horas Extras</p>
            </div>
          </div>

          <!-- Desktop Navigation Tabs -->
          <nav id="desktop-nav" class="hidden md:flex items-center space-x-1 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
            <button data-nav="catalogo" class="nav-tab active flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-white bg-blue-600 shadow-sm shadow-blue-500/30">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span>1. Catálogo</span>
            </button>
            <button data-nav="seleccion" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              <span>2. Selección</span>
            </button>
            <button data-nav="control" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
              <i data-lucide="play-circle" class="w-4 h-4"></i>
              <span>3. Control en Vivo</span>
            </button>
            <button data-nav="historial" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
              <i data-lucide="history" class="w-4 h-4"></i>
              <span>4. Historial</span>
            </button>
            <button data-nav="horas-extras" class="nav-tab flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
              <i data-lucide="clock" class="w-4 h-4"></i>
              <span>5. Horas Extras</span>
            </button>
          </nav>

          <!-- Right Action: Config Modal Gear & Theme Toggle -->
          <div class="flex items-center space-x-2">
            <button id="btn-theme-toggle" title="Alternar Modo Oscuro / Claro" class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors border border-transparent hover:border-slate-700">
              <i data-lucide="moon" class="w-5 h-5 dark:block hidden"></i>
              <i data-lucide="sun" class="w-5 h-5 dark:hidden block"></i>
            </button>
            <button id="btn-open-settings" title="Configuración y Respaldos" class="flex items-center space-x-1.5 p-2 rounded-xl text-slate-300 bg-slate-800/80 hover:bg-slate-700 hover:text-white transition-all border border-slate-700/60">
              <i data-lucide="settings" class="w-5 h-5"></i>
              <span class="hidden sm:inline text-xs font-semibold">Configuración</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Mobile Sub-Navigation Bar (Scrollable) -->
      <div class="md:hidden border-t border-slate-800/80 bg-slate-950/80 overflow-x-auto py-2 px-4 no-scrollbar">
        <div id="mobile-nav" class="flex space-x-2 min-w-max">
          <button data-nav="catalogo" class="nav-tab-mobile active px-3 py-1.5 rounded-lg text-xs font-medium text-white bg-blue-600 flex items-center space-x-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>1. Catálogo</span>
          </button>
          <button data-nav="seleccion" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 flex items-center space-x-1.5">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
            <span>2. Selección</span>
          </button>
          <button data-nav="control" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 flex items-center space-x-1.5">
            <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
            <span>3. Control</span>
          </button>
          <button data-nav="historial" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 flex items-center space-x-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
            <span>4. Historial</span>
          </button>
          <button data-nav="horas-extras" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 flex items-center space-x-1.5">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>5. H. Extras</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      
      <!-- System DB Connection & Status Card (Module 1 Validation) -->
      <div id="db-status-banner" class="mb-6 p-4 rounded-2xl bg-gradient-to-r from-slate-800/80 to-slate-900/80 border border-slate-700/80 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-sm font-bold text-slate-200">Base de Datos IndexedDB (Dexie.js)</span>
              <span id="db-status-pill" class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono border border-emerald-500/30">Conectada</span>
            </div>
            <p id="db-status-details" class="text-xs text-slate-400 font-mono mt-0.5">Verificando tablas del esquema...</p>
          </div>
        </div>
        <div class="flex items-center space-x-2 text-xs">
          <span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700/70 font-mono">Esquema v1</span>
          <button id="btn-test-db" class="px-3 py-1 rounded-lg bg-blue-600/80 hover:bg-blue-600 text-white font-medium transition-colors flex items-center space-x-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            <span>Probar Test DB</span>
          </button>
        </div>
      </div>

      <!-- Dynamic Views Container -->
      <div id="view-container" class="min-h-[400px]">
        <!-- Active View rendered by main.js -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-4 px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 bg-slate-950/40">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>GeorgisWork CNC &copy; 2026 - PWA Offline Local</p>
        <p class="text-slate-600 font-mono">Módulo 1: Setup & Dexie.js OK</p>
      </div>
    </footer>

    <!-- Contenedor dinámico de modales -->
    <div id="modal-container-root"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
