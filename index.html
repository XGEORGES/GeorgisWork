<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeorgisWork" />
    <meta name="description" content="Sistema de Gestión de Trabajos CNC (PWA Local) con persistencia IndexedDB y exportación de reportes." />
    <title>GeorgisWork - Gestión de Trabajos CNC</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-[#080d16] text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500 selection:text-slate-950 relative overflow-x-hidden">
    
    <!-- Ambient Glow Layers (Efecto de Iluminación Ambiental) -->
    <div class="pointer-events-none fixed -top-40 -left-40 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] z-0"></div>
    <div class="pointer-events-none fixed -bottom-40 -right-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-[120px] z-0"></div>

    <!-- Top Navigation Header (Dock Flotante Syntrix) -->
    <header class="sticky top-4 z-40 bg-slate-950/70 backdrop-blur-xl border border-slate-800/80 rounded-2xl px-5 py-3 mx-4 mt-4 shadow-xl transition-all">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        
        <!-- Logo & Brand Title (Sólido y Nítido) -->
        <div class="flex items-center space-x-3">
          <div class="h-10 w-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 p-0.5 shadow-md shadow-cyan-500/10 flex items-center justify-center">
            <img src="./icon.png" alt="GeorgisWork Logo" class="h-full w-full object-cover rounded-[10px]" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="hidden h-full w-full bg-slate-950 rounded-[10px] items-center justify-center text-cyan-400 font-bold text-lg">GW</div>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-lg text-white font-bold tracking-tight">
                GeorgisWork
              </span>
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                CNC v1.0
              </span>
            </div>
            <p class="text-xs text-slate-400">Control de Fabricación & Horas Extras</p>
          </div>
        </div>

        <!-- Desktop Navigation Tabs (Segmented Control Flotante) -->
        <nav id="desktop-nav" class="hidden md:flex items-center bg-slate-900/80 p-1.5 rounded-xl border border-slate-800/60 gap-1 shadow-inner">
          <button data-nav="catalogo" class="nav-tab active bg-slate-800 text-cyan-400 font-semibold shadow-md shadow-cyan-950/30 border border-cyan-500/30 rounded-lg px-3 py-1.5 text-sm flex items-center space-x-2 transition-all cursor-pointer">
            <i data-lucide="layers" class="w-4 h-4"></i>
            <span>1. Catálogo</span>
          </button>
          <button data-nav="seleccion" class="nav-tab text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg px-3 py-1.5 transition-all text-sm font-medium flex items-center space-x-2 cursor-pointer">
            <i data-lucide="check-square" class="w-4 h-4"></i>
            <span>2. Selección</span>
          </button>
          <button data-nav="control" class="nav-tab text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg px-3 py-1.5 transition-all text-sm font-medium flex items-center space-x-2 cursor-pointer">
            <i data-lucide="play-circle" class="w-4 h-4"></i>
            <span>3. Control en Vivo</span>
          </button>
          <button data-nav="historial" class="nav-tab text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg px-3 py-1.5 transition-all text-sm font-medium flex items-center space-x-2 cursor-pointer">
            <i data-lucide="history" class="w-4 h-4"></i>
            <span>4. Historial</span>
          </button>
          <button data-nav="horas-extras" class="nav-tab text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-lg px-3 py-1.5 transition-all text-sm font-medium flex items-center space-x-2 cursor-pointer">
            <i data-lucide="clock" class="w-4 h-4"></i>
            <span>5. Horas Extras</span>
          </button>
        </nav>

        <!-- Right Action: Config Modal Gear -->
        <div class="flex items-center">
          <button id="btn-open-settings" title="Configuración y Respaldos" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-slate-300 bg-slate-900/80 hover:bg-slate-800 hover:text-white transition-all border border-slate-800/80 shadow-md active:scale-95 cursor-pointer">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span class="hidden sm:inline text-xs font-semibold">Configuración</span>
          </button>
        </div>

      </div>

      <!-- Mobile Sub-Navigation Bar -->
      <div class="md:hidden mt-3 pt-2.5 border-t border-slate-800/60 overflow-x-auto no-scrollbar">
        <div id="mobile-nav" class="flex space-x-1.5 min-w-max p-1 rounded-xl bg-slate-900/80 border border-slate-800/60">
          <button data-nav="catalogo" class="nav-tab-mobile active px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-cyan-400 shadow-md border border-cyan-500/30 flex items-center space-x-1.5">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>1. Catálogo</span>
          </button>
          <button data-nav="seleccion" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5">
            <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
            <span>2. Selección</span>
          </button>
          <button data-nav="control" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5">
            <i data-lucide="play-circle" class="w-3.5 h-3.5"></i>
            <span>3. Control</span>
          </button>
          <button data-nav="historial" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5"></i>
            <span>4. Historial</span>
          </button>
          <button data-nav="horas-extras" class="nav-tab-mobile px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center space-x-1.5">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>5. H. Extras</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 relative z-10">
      
      <!-- Dynamic Views Container -->
      <div id="view-container" class="min-h-[450px]">
        <!-- Active View rendered by main.js -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-4 px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 bg-slate-950/40 relative z-10 transition-colors">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>GeorgisWork CNC &copy; 2026 - PWA Offline Local</p>
        <p class="text-slate-600 font-mono">Control de Fabricación & Horas Extras</p>
      </div>
    </footer>

    <!-- Contenedor dinámico de modales -->
    <div id="modal-container-root"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
